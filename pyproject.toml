[project]
name = "seccm-processing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "opencv-contrib-python>=4.13.0.92",
    "polars>=1.39.3",
    "pyqt5>=5.15.11",
    "pyside6>=6.10.2",
    "ruff>=0.15.5",
    "ruptures>=1.1.10",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true

[tool.pyright]
extraPaths = ["src"]

[tool.ruff]
src = ["src"]
